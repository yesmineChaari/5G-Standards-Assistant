corpus:
  specs:
    - id: "TS 23.501"
      short: "23501"
      title: "System architecture for the 5G System (5GS)"
      version: "18.12.0"
      release: "Rel-18"
      url: "https://www.3gpp.org/ftp/Specs/archive/23_series/23.501/"
      file: "23501-ic0.zip"
    - id: "TS 24.501"
      short: "24501"
      title: "Non-Access-Stratum (NAS) protocol for 5G System (5GS); Stage 3"
      version: "18.14.0"
      release: "Rel-18"
      url: "https://www.3gpp.org/ftp/Specs/archive/24_series/24.501/"
      file: "24501-ie0.zip"
paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  chunks_file: "data/processed/chunks.jsonl"
  acronyms_file: "data/processed/acronyms.json"
  results_dir: "eval/results"
  corpus_doc: "CORPUS.md"
chunking:
  max_tokens: 450
  overlap_tokens: 60
  min_tokens: 40
  max_table_tokens: 480
  # Token counts use the embedding model tokenizer, so limits are exact for the embedder.
  tokenizer: "BAAI/bge-base-en-v1.5"
  # Hard cap on header + text + special tokens = embedding window: no chunk is ever truncated.
  max_index_tokens: 512
embeddings:
  model: "BAAI/bge-base-en-v1.5"
  query_instruction: "Represent this sentence for searching relevant passages: "
  normalize: true
  batch_size: 8
  max_seq_length: 512
  device: "auto"          # auto | cpu | cuda
vector_store:
  path: "data/indexes/chroma"
  collection: "specs_rel18"
  distance: "cosine"
  exact_search: true   # exact cosine search over all vectors (deterministic); false = Chroma HNSW (approximate)
bm25:
  path: "data/indexes/bm25.pkl"
  stem: true              # light plural stemming of plain English words (never identifiers)
  k1: 1.5
  b: 0.75
retrieval:
  dense_k: 30
  bm25_k: 30
  rrf_k: 60
  final_k: 6
  rerank_candidates: 30   # fused candidates scored by the cross-encoder
  use_hybrid: true
  use_reranker: true
  use_routing: true
  use_acronym_expansion: true
reranker:
  model: "BAAI/bge-reranker-v2-m3"
  fallback_model: "BAAI/bge-reranker-base"
  use_fallback_on_cpu: true   # v2-m3 (568M params) is slow and memory-hungry on CPU
  device: "auto"              # auto | cpu | cuda
  batch_size: 8
  max_length: 512
  refusal_threshold: 0.15
llm:
  provider: "groq"
  model: "openai/gpt-oss-120b"
  temperature: 0.0
  # Reasoning models count their hidden reasoning in max_tokens, so the budgets are generous.
  max_tokens: 4096
  classify_max_tokens: 512
  reasoning_effort: "low"   # sent only to reasoning models (gpt-oss, o-series); null to disable
  max_retries: 3
  backoff_s: 2.0
refusal_message: "I could not find this information in the documents."
seed: 42
evaluation:
  # RAGAS judge: a model from a different family than the generator (gpt-oss), to limit
  # self-preference bias. Reached through an OpenAI-compatible endpoint (gemini, groq, openai, ollama).
  # flash-lite: the free tier of the larger Gemini flash models allows only 20 requests per day,
  # while RAGAS needs several requests per answer. 3.5 replaced 3.1, which stayed overloaded (HTTP 503).
  judge_provider: "gemini"
  judge_model: "gemini-3.5-flash-lite"
  judge_reasoning_effort: null
  # Earlier judges whose cached scores are shown next to the current judge (no API calls).
  # gpt-oss-20b: same family as the generator (qwen3 was tried first: its free tier allows only
  # 1000 output tokens per minute, too few for RAGAS).
  compare_judges: ["gemini:gemini-3.1-flash-lite", "groq:openai/gpt-oss-20b"]
  # RAGAS costs about 8k judge tokens per answer; one judge scores every configuration so that
  # the ablations compare like with like.
  ragas_configs: ["full", "hybrid_rerank", "full_no_hybrid", "full_no_rerank", "dense_only"]
  generation_configs: ["full", "hybrid_rerank", "full_no_hybrid", "full_no_rerank", "dense_only"]
